<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Capability matrix and skill radar">
<defs>
<filter id="gS" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gM" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gL" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10.0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".30"/></pattern>
<radialGradient id="radarBg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
<linearGradient id="polyFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity=".42"/>
    <stop offset="100%" stop-color="#ff2d95" stop-opacity=".34"/></linearGradient>
<linearGradient id="barG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff"/><stop offset="60%" stop-color="#7b2dff"/>
    <stop offset="100%" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity=".55"/></linearGradient>
<style>
    .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .radarSweep{animation:spin 4.5s linear infinite;transform-origin:300px 268px;}
    @keyframes ring{0%{r:16;opacity:.7}100%{r:150;opacity:0}}
    .ping circle{animation:ring 3s ease-out infinite;}
    @keyframes rise{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
    .rise{animation:rise .7s ease-out both;}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    </style>
</defs>
