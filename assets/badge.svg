<svg xmlns="http://www.w3.org/2000/svg" width="420" height="640" viewBox="0 0 420 640" role="img" aria-label="Operator credential badge for Aviral Srivastava">
<defs>
<filter id="gS" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gM" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gL" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10.0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7b2dff"/><stop offset="50%" stop-color="#c04bff"/>
    <stop offset="100%" stop-color="#5b18cc"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e8eef5"/><stop offset="42%" stop-color="#8fa3b8"/>
    <stop offset="60%" stop-color="#dfe8f2"/><stop offset="100%" stop-color="#6d7f93"/></linearGradient>
<linearGradient id="cardBg" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0%" stop-color="#141a33"/><stop offset="55%" stop-color="#0a0e1f"/>
    <stop offset="100%" stop-color="#12082a"/></linearGradient>
<linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00f0ff"/><stop offset="50%" stop-color="#c04bff"/>
    <stop offset="100%" stop-color="#ff2d95"/></linearGradient>
<linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="42%" stop-color="#ffffff" stop-opacity=".16"/>
    <stop offset="52%" stop-color="#ff2d95" stop-opacity=".13"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
<radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
<clipPath id="cardClip"><rect x="60" y="250" width="300" height="362" rx="16"/></clipPath>
<style>
    .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;}
    /* pendulum: the rig swings from the neck, the card trails a beat behind */
    @keyframes swing{0%{transform:rotate(-3.4deg)}50%{transform:rotate(3.4deg)}100%{transform:rotate(-3.4deg)}}
    @keyframes lag{0%{transform:rotate(1.5deg)}50%{transform:rotate(-1.5deg)}100%{transform:rotate(1.5deg)}}
    .rig{animation:swing 4.6s ease-in-out infinite;transform-origin:210px 4px;}
    .card{animation:lag 4.6s ease-in-out infinite;transform-origin:210px 250px;animation-delay:-0.4s;}
    @keyframes sheen{0%{transform:translateX(-340px)}55%,100%{transform:translateX(340px)}}
    .sheen{animation:sheen 5.5s ease-in-out infinite;}
    @keyframes scanl{0%{transform:translateY(-38px)}100%{transform:translateY(38px)}}
    .scanl{animation:scanl 2.6s ease-in-out infinite alternate;}
    @keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
    .blip{animation:blip 1.8s ease-in-out infinite;}
    @media (prefers-reduced-motion:reduce){
      .rig,.card,.sheen,.scanl,.blip{animation:none!important}
    }
    </style>
