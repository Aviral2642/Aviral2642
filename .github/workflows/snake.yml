name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"      # twice a day
  workflow_dispatch:            # let me run it by hand
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from the contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0a0e1f,#0e3a44,#12707f,#1cb6c9,#00f0ff

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
