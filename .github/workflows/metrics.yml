name: Update GitHub Profile with HTB Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: README.md

          base: ""
          config_timezone: America/New_York

          # ✅ HTB Plugin (correct syntax)
          plugin_hackthebox: yes
          plugin_hackthebox_sections: stats
          plugin_hackthebox_user: AviralxRoot
